# M20 Big MuJoCo deployment (paths are relative to repo root)
control_dt: 0.02

# Total simulation time
simulation_duration: 600000000.0
# Simulation time step
simulation_dt: 0.005
# Controller update frequency (simulation_dt * control_decimation = 0.02; 50Hz)
control_decimation: 4

policy_path: logs/M20_Big/exported/policies/policy_dwaq.onnx
xml_path: deploy/deploy_mujoco/m20_big/urdf/cross_stairs.xml

# Isaac Gym policy dof order (must match training env dof_names)
isaac_dof_names:
  - FL_hip_joint
  - FL_thigh_joint
  - FL_calf_joint
  - FL_foot_joint
  - FR_hip_joint
  - FR_thigh_joint
  - FR_calf_joint
  - FR_foot_joint
  - RL_hip_joint
  - RL_thigh_joint
  - RL_calf_joint
  - RL_foot_joint
  - RR_hip_joint
  - RR_thigh_joint
  - RR_calf_joint
  - RR_foot_joint

init_base_height: 0.80
num_obs_hist: 5

kps: [160, 160, 160, 0, 160, 160, 160, 0, 160, 160, 160, 0, 160, 160, 160, 0]
kds: [5, 5, 5, 0.6, 5, 5, 5, 0.6, 5, 5, 5, 0.6, 5, 5, 5, 0.6]

# default_angles in Isaac Gym order: FL, FR, RL, RR
default_angles: [
                  0.0, 0.6, -1.0, 0.0,
                  0.0, 0.6, -1.0, 0.0,
                  0.0, -0.6, 1.0, 0.0,
                  0.0, -0.6, 1.0, 0.0]

torque_limits: [76.4, 76.4, 76.4, 21.6,
                76.4, 76.4, 76.4, 21.6,
                76.4, 76.4, 76.4, 21.6,
                76.4, 76.4, 76.4, 21.6]

lin_vel_scale: 2.0
ang_vel_scale: 0.25
cmd_scale: [2, 2, 0.25]
dof_pos_scale: 1.0
dof_vel_scale: 0.05
cmd_init: [0, 0, 0]

max_cmd: [1.5, 1.0, 2.0]
use_joystick: true
arrow_height: 0.45
vel_arrow_height: 0.58
arrow_scale: 0.6
base_body_names: ["base"]
cmd_arrow_rgba: [0.15, 0.45, 1.0, 0.95]
vel_arrow_rgba: [0.15, 0.85, 0.25, 0.95]

vel_scale: 5

action_scale: 0.25

num_actions: 16
num_obs: 57

wheel_sim_indices: [3, 7, 11, 15]

wheel_speed: 1
