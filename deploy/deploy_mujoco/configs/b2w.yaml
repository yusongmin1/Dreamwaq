# B2W MuJoCo Sim2Sim (mjcf from rl_sar b2w_description, paths relative to repo root)
control_dt: 0.02

simulation_duration: 600000000.0
simulation_dt: 0.005
control_decimation: 4

policy_path: logs/B2W/exported/policies/policy_dwaq.onnx
xml_path: deploy/deploy_mujoco/B2W/mjcf/race_track.xml

# kp/kd 与训练配置 legged_gym/envs/B2W/b2w_config.py 一致
kps: [160, 160, 160, 0, 160, 160, 160, 0, 160, 160, 160, 0, 160, 160, 160, 0]
kds: [5, 5, 5, 1, 5, 5, 5, 1,5, 5, 5, 1,5, 5, 5, 1,]

# 策略顺序 FL, FR, RL, RR x [hip, thigh, calf, foot(wheel)]
default_angles: [
                  0.0, 0.8, -1.5, 0.0,
                  0.0, 0.8, -1.5, 0.0,
                  0.0, 1.0, -1.5, 0.0,
                  0.0, 1.0, -1.5, 0.0]

# URDF effort 限制: hip 200, thigh 200, calf 320, wheel 20
torque_limits: [200., 200., 320., 20.,
                200., 200., 320., 20.,
                200., 200., 320., 20.,
                200., 200., 320., 20.]

lin_vel_scale: 2.0
ang_vel_scale: 0.25
cmd_scale: [2, 2, 0.25]
dof_pos_scale: 1.0
dof_vel_scale: 0.05
cmd_init: [0, 0, 0]

max_cmd: [0.5, 1.0, 2.0]
use_joystick: true
arrow_height: 0.45
vel_arrow_height: 0.58
arrow_scale: 0.6
base_body_names: ["base_link"]
cmd_arrow_rgba: [0.15, 0.45, 1.0, 0.95]
vel_arrow_rgba: [0.15, 0.85, 0.25, 0.95]

vel_scale: 10
# 与训练一致: hip=0.125, thigh/calf/foot=0.25 (FL/FR/RL/RR)
action_scale: [
  0.125, 0.25, 0.25, 0.25,
  0.125, 0.25, 0.25, 0.25,
  0.125, 0.25, 0.25, 0.25,
  0.125, 0.25, 0.25, 0.25]

# 关节速度实时曲线窗口（默认关闭；也可用命令行 --plot_joint_vel）
plot_joint_vel: false

num_actions: 16
num_obs: 57
num_obs_hist: 5
init_base_height: 0.65

wheel_sim_indices: [3, 7, 11, 15]

# MuJoCo 关节名按策略顺序排列 (轮子在 mjcf 中名为 *_wheel_joint, 训练时为 *_foot_joint)
isaac_dof_names: [
  FL_hip_joint, FL_thigh_joint, FL_calf_joint, FL_wheel_joint,
  FR_hip_joint, FR_thigh_joint, FR_calf_joint, FR_wheel_joint,
  RL_hip_joint, RL_thigh_joint, RL_calf_joint, RL_wheel_joint,
  RR_hip_joint, RR_thigh_joint, RR_calf_joint, RR_wheel_joint]
